---
layout: default
title: Works
---

<div class="page-header">
  <h1>Works</h1>
</div>

<div class="grid">
  {% for work in site.works %}
    <a href="{{ work.url }}" class="grid-item">
      {% if work.featured_image %}
        <img src="{{ work.featured_image }}" alt="{{ work.title }}">
      {% endif %}
      <h2>{{ work.title }}</h2>
      {% if work.year %}
        <span class="work-year">{{ work.year }}</span>
      {% endif %}
    </a>
  {% endfor %}
</div>
